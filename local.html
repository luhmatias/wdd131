<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Informações sobre o Canadá, incluindo dados do país e informações sobre o clima.">

    <meta name="author" content="Lu">

    <title>Canadá | WDD 131</title>

    <link rel="stylesheet" href="estilos/local.css">
    <script src="scripts/local.js" defer></script>
</head>

<body>

    <!-- Cabeçalho -->
    <header>
        <h1>Canadá</h1>
    </header>

    <!-- Conteúdo principal -->
    <main>

        <section class="hero">

            <!-- Imagens responsivas -->
            <picture>

                <!-- Imagem para computador -->
                <source
                    media="(min-width: 700px)"
                    srcset="imagens/can2.webp"
                    type="image/webp">

                <!-- Imagem para celular -->
                <img
                    src="imagens/can1.webp"
                    alt="Paisagem natural do Canadá com lago, montanhas e floresta"
                    width="2048"
                    height="1366">

            </picture>

            <!-- Informações do Canadá -->
            <section class="informacoes">

                <h2>Canadá</h2>

                <div class="dados">

                    <p><strong>Capital:</strong> Ottawa</p>

                    <p><strong>Área:</strong> 9.984.670 km²</p>

                    <p><strong>População:</strong> aproximadamente 41 milhões</p>

                    <p><strong>Moeda:</strong> Dólar canadense</p>

                    <p><strong>Idiomas:</strong> Inglês e francês</p>

                </div>

            </section>

            <!-- Informações do clima -->
            <section class="clima">

                <h2>
                    Clima

                    <!-- Ícone SVG para celular -->
                    <span class="icone-clima">
                        <img src="imagens/clima.svg" alt="">
                    </span>

                    <!-- Emoji para computador -->
                    <span class="emoji-clima">⛅</span>

                </h2>

                <div class="clima-dados">

                    <p>
                        <strong>Temperatura:</strong>
                        <span id="temperatura">-5 °C</span>
                    </p>

                    <p>
                        <strong>Condição:</strong>
                        Parcialmente nublado
                    </p>

                    <p>
                        <strong>Vento:</strong>
                        <span id="vento">10 km/h</span>
                    </p>

                    <p>
                        <strong>Sensação térmica:</strong>
                        <span id="sensacao">N/A</span>
                    </p>

                </div>

            </section>

        </section>

    </main>

    <!-- Rodapé -->
    <footer>

        <p>
            &copy; <span id="ano"></span> Canadá | WDD 131
        </p>

        <p>
            Última modificação:
            <span id="ultima-modificacao"></span>
        </p>

    </footer>

</body>
</html>
